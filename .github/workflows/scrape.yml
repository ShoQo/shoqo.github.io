name: Scrape jobs

on:
  schedule:
    # 06:00 UTC = 15:00 JST daily.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrapers/**"
      - "data/companies.json"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test scrapers
        run: python -m unittest discover -s scrapers/tests -t .

      - name: Scrape
        id: scrape
        # Keep going on a scraper failure: run.py falls back to the previous
        # jobs for that company, so the good data still gets committed below.
        continue-on-error: true
        run: python -m scrapers.run

      - name: Commit updated jobs
        run: |
          if git diff --quiet -- data/jobs.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore: update jobs feed"
          git push

      - name: Fail if any scraper failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1
